<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#F8DAD2" opacity="0.25"/>
  
  <!-- Browser Window -->
  <rect x="40" y="40" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5"/>
  <path d="M40 68 H220" stroke="#0A0A0A" stroke-width="2.5"/>
  <circle cx="56" cy="54" r="4" fill="#F63E04"/>
  <circle cx="70" cy="54" r="4" fill="#0A0A0A" opacity="0.3"/>
  <circle cx="84" cy="54" r="4" fill="#0A0A0A" opacity="0.3"/>
  <rect x="56" y="82" width="60" height="8" rx="2" fill="#0A0A0A"/>
  <rect x="56" y="98" width="120" height="6" rx="2" fill="#686868" opacity="0.4"/>
  <rect x="56" y="110" width="90" height="6" rx="2" fill="#686868" opacity="0.4"/>
  <rect x="56" y="126" width="40" height="18" rx="4" fill="#F63E04"/>

  <!-- Connecting Line Client -> Server -->
  <path d="M130 160 V210 H220" stroke="#F63E04" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Server Stack -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="160" height="32" rx="6" fill="#0A0A0A"/>
    <circle cx="20" cy="16" r="4" fill="#F63E04"/>
    <line x1="36" y1="16" x2="100" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <rect x="0" y="40" width="160" height="32" rx="6" fill="#0A0A0A"/>
    <circle cx="20" cy="56" r="4" fill="#F63E04"/>
    <line x1="36" y1="56" x2="120" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Database Cylinder -->
  <g transform="translate(70, 190)">
    <path d="M0 15 C0 5 25 0 50 0 C75 0 100 5 100 15 V55 C100 65 75 70 50 70 C25 70 0 65 0 55 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5"/>
    <ellipse cx="50" cy="15" rx="50" ry="12" fill="#F8DAD2" stroke="#0A0A0A" stroke-width="2.5"/>
    <path d="M0 35 C0 45 25 50 50 50 C75 50 100 45 100 35" stroke="#0A0A0A" stroke-width="2.5" fill="none"/>
    <path d="M50 0 V70" stroke="#F63E04" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
</svg>
