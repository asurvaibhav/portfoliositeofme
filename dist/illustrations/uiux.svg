<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#F8DAD2" opacity="0.25"/>

  <!-- Wireframe Box Background -->
  <rect x="40" y="50" width="150" height="180" rx="12" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="58" y="70" width="114" height="60" rx="6" fill="#F8DAD2" stroke="#0A0A0A" stroke-width="1.5" opacity="0.7"/>
  <line x1="58" y1="145" x2="150" y2="145" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="160" x2="120" y2="160" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
  <rect x="58" y="180" width="70" height="24" rx="6" fill="#0A0A0A" opacity="0.15"/>

  <!-- Transformation Arrow -->
  <path d="M195 140 H225 M215 130 L228 140 L215 150" stroke="#F63E04" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Polished Card Front -->
  <rect x="220" y="70" width="150" height="180" rx="12" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5"/>
  <rect x="236" y="86" width="118" height="65" rx="8" fill="#F63E04"/>
  <circle cx="295" cy="118" r="14" fill="#FFFFFF"/>
  <path d="M291 118 L294 121 L301 114" stroke="#F63E04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="236" y="163" width="90" height="8" rx="2" fill="#0A0A0A"/>
  <rect x="236" y="177" width="118" height="6" rx="2" fill="#686868" opacity="0.4"/>
  <rect x="236" y="195" width="80" height="28" rx="6" fill="#0A0A0A"/>
  <text x="276" y="213" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VIEW</text>

  <!-- Interactive Cursor -->
  <g transform="translate(310, 210)">
    <path d="M0 0 L18 12 L11 14 L15 22 L11 24 L7 16 L0 20 Z" fill="#F63E04" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
