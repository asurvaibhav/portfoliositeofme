<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#F8DAD2" opacity="0.25"/>

  <!-- File/Code Sheet Background -->
  <rect x="70" y="50" width="160" height="200" rx="10" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5"/>
  <path d="M190 50 L230 90 H190 V50 Z" fill="#F8DAD2" stroke="#0A0A0A" stroke-width="2.5"/>
  <line x1="95" y1="85" x2="165" y2="85" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="105" x2="175" y2="105" stroke="#686868" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="95" y1="125" x2="150" y2="125" stroke="#686868" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="95" y1="145" x2="170" y2="145" stroke="#686868" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="95" y1="165" x2="130" y2="165" stroke="#686868" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="95" y1="185" x2="160" y2="185" stroke="#686868" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Security Shield Over File -->
  <g transform="translate(180, 80)">
    <path d="M70 0 C120 0 140 20 140 20 V80 C140 130 70 160 70 160 C70 160 0 130 0 80 V20 C0 20 20 0 70 0 Z" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M70 10 C110 10 128 26 128 26 V76 C128 120 70 146 70 146 C70 146 12 120 12 76 V26 C12 26 30 10 70 10 Z" fill="#F63E04"/>
    
    <!-- Keyhole -->
    <circle cx="70" cy="65" r="16" fill="#FFFFFF"/>
    <path d="M64 74 L76 74 L80 100 H60 Z" fill="#FFFFFF"/>
    <circle cx="70" cy="65" r="8" fill="#0A0A0A"/>
  </g>
</svg>
